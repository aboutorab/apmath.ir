<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسم نمودار دوبعدی با زوم هوشمند و دکمه‌های +/-</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
      direction: rtl;
    }
    #info { text-align: center; margin-bottom: 20px; }
    #info h2 { margin: 0 0 8px 0; font-size: 26px; color: #ff6b6b; }
    #info p { margin: 4px 0; color: #b0b0b0; font-size: 13px; }
    .canvas-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 107, 107, 0.4);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }
    canvas { display: block; border-radius: 10px; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .zoom-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .zoom-buttons button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 107, 0.7);
      background: rgba(0, 0, 0, 0.7);
      color: #ff6b6b;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      backdrop-filter: blur(5px);
    }
    .zoom-buttons button:hover {
      background: rgba(255, 107, 107, 0.4);
      color: white;
      border-color: #ff6b6b;
      transform: scale(1.1);
      box-shadow: 0 0 18px rgba(255, 107, 107, 0.5);
    }
    .zoom-buttons button:active { transform: scale(0.95); }
    .controls-panel {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-top: 20px; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px; border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .field-group { display: flex; align-items: center; gap: 6px; }
    .field-group label { font-size: 12px; color: #aaa; }
    .field-group input[type="text"],
    .field-group input[type="number"] {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 107, 107, 0.3);
      color: #fff; padding: 6px 10px; border-radius: 18px;
      font-size: 13px; font-family: 'Courier New', monospace;
      width: 90px; text-align: center; transition: all 0.3s;
    }
    .field-group input[type="text"] { width: 220px; direction: ltr; text-align: left; }
    .field-group input:focus { outline: none; border-color: #ff6b6b; box-shadow: 0 0 12px rgba(255, 107, 107, 0.4); }
    .field-group input[type="number"] { direction: ltr; }
    .controls-panel button {
      background: #ff6b6b; color: white; border: none;
      padding: 8px 22px; border-radius: 25px; font-size: 14px;
      cursor: pointer; transition: all 0.3s; font-weight: bold;
    }
    .controls-panel button:hover { background: #ff8787; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4); }
    .value-display {
      text-align: center; margin-top: 10px; font-size: 15px;
      color: #ffd93d; min-height: 22px;
    }
    .precision-indicator {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffd93d;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 217, 61, 0.4);
    }
    .examples-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
    .example-chip {
      background: rgba(255, 255, 255, 0.08); color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 14px;
      border-radius: 18px; font-size: 12px; cursor: pointer;
      transition: all 0.25s; font-family: 'Courier New', monospace; direction: ltr;
    }
    .example-chip:hover { background: rgba(255, 107, 107, 0.25); border-color: #ff6b6b; color: #fff; }
  </style>
</head>
<body>
  <div id="info">
    <h2>📐 رسم نمودار دوبعدی با زوم هوشمند</h2>
    <p>🖱️ با ماوس بکشید تا جابجا شوید | اسکرول کنید تا زوم کنید | دقت خودکار افزایش می‌یابد</p>
    <p>➕➖ از دکمه‌های گوشهٔ بالا-راست نیز می‌توانید استفاده کنید</p>
  </div>

  <div class="canvas-wrapper">
    <canvas id="graphCanvas" width="800" height="550"></canvas>
    <div class="zoom-buttons">
      <button id="zoomInBtn" title="زوم مثبت">+</button>
      <button id="zoomOutBtn" title="زوم منفی">−</button>
    </div>
    <div class="precision-indicator" id="precisionIndicator">🔬 دقت: ۱۰۰۰</div>
  </div>

  <div class="value-display" id="valueDisplay">مختصات: —</div>

  <div class="controls-panel">
    <div class="field-group">
      <label>f(x) =</label>
      <input type="text" id="functionInput" value="Math.sin(x) * Math.cos(x/2)" dir="ltr">
    </div>
    <div class="field-group">
      <label>xMin</label>
      <input type="number" id="xMinInput" value="-8" step="any">
    </div>
    <div class="field-group">
      <label>xMax</label>
      <input type="number" id="xMaxInput" value="8" step="any">
    </div>
    <div class="field-group">
      <label>yMin</label>
      <input type="number" id="yMinInput" value="-5" step="any">
    </div>
    <div class="field-group">
      <label>yMax</label>
      <input type="number" id="yMaxInput" value="5" step="any">
    </div>
    <div class="field-group">
      <label>🔬 دقت (نقاط):</label>
      <input type="number" id="precisionInput" value="1000" min="10" max="50000" step="10">
    </div>
    <button id="drawButton">🔄 رسم</button>
    <button id="resetButton" style="background:#475;">↺ پیش‌فرض</button>
  </div>

  <div class="examples-row">
    <span style="color:#888; font-size:12px;">📋 مثال‌ها:</span>
    <button class="example-chip" data-func="Math.sqrt(x)" data-xmin="-4" data-xmax="16" data-ymin="-4" data-ymax="4">sqrt(x)</button>
	<button class="example-chip" data-func="Math.sin(x)" data-xmin="-8" data-xmax="8" data-ymin="-3" data-ymax="3">sin(x)</button>
    <button class="example-chip" data-func="Math.cos(x)" data-xmin="-8" data-xmax="8" data-ymin="-3" data-ymax="3">cos(x)</button>
    <button class="example-chip" data-func="Math.tan(x)" data-xmin="-6.28" data-xmax="6.28" data-ymin="-10" data-ymax="10">tan(x)</button>
    <button class="example-chip" data-func="Math.log(x)" data-xmin="-3" data-xmax="10" data-ymin="-5" data-ymax="4">log(x)</button>
    <button class="example-chip" data-func="x*x" data-xmin="-5" data-xmax="5" data-ymin="-1" data-ymax="15">x²</button>
	<button class="example-chip" data-func="x*x*x" data-xmin="-8" data-xmax="8" data-ymin="-3" data-ymax="3">x³</button>
	<button class="example-chip" data-func="x*x*x - 3*x" data-xmin="-8" data-xmax="8" data-ymin="-3" data-ymax="3">x³ - 3x</button>
    <button class="example-chip" data-func="Math.exp(-x*x/4)*Math.cos(3*x)" data-xmin="-6" data-xmax="6" data-ymin="-1.5" data-ymax="1.5">e^(-x²/4)·cos(3x)</button>
    <button class="example-chip" data-func="Math.sin(x)/x" data-xmin="-15" data-xmax="15" data-ymin="-0.5" data-ymax="1.2">sin(x)/x</button>
	<button class="example-chip" data-func="1/(1+Math.exp(-x))" data-xmin="-8" data-xmax="8" data-ymin="-3" data-ymax="3">1/(1+e⁻ˣ)</button>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      const functionInput = document.getElementById('functionInput');
      const xMinInput = document.getElementById('xMinInput');
      const xMaxInput = document.getElementById('xMaxInput');
      const yMinInput = document.getElementById('yMinInput');
      const yMaxInput = document.getElementById('yMaxInput');
      const precisionInput = document.getElementById('precisionInput');
      const drawButton = document.getElementById('drawButton');
      const resetButton = document.getElementById('resetButton');
      const valueDisplay = document.getElementById('valueDisplay');
      const precisionIndicator = document.getElementById('precisionIndicator');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const exampleChips = document.querySelectorAll('.example-chip');

      let xMin = -8, xMax = 8, yMin = -5, yMax = 5;
      let currentPrecision = 1000;
      let isDragging = false, dragStartX = 0, dragStartY = 0;
      let dragStartXMin = 0, dragStartXMax = 0, dragStartYMin = 0, dragStartYMax = 0;
      let mouseX = null, mouseY = null;

      // ---------- اعتبارسنجی ----------
      function readBoundsFromInputs() {
        xMin = parseFloat(xMinInput.value);
        xMax = parseFloat(xMaxInput.value);
        yMin = parseFloat(yMinInput.value);
        yMax = parseFloat(yMaxInput.value);
        if (isNaN(xMin) || isNaN(xMax) || isNaN(yMin) || isNaN(yMax)) return false;
        if (xMin >= xMax || yMin >= yMax) {
          alert('بازه نامعتبر است. مطمئن شوید xMin < xMax و yMin < yMax.');
          return false;
        }
        return true;
      }

      function readPrecision() {
        const precision = parseInt(precisionInput.value);
        if (isNaN(precision) || precision < 2) {
          alert('دقت باید حداقل ۲ نقطه باشد.');
          return null;
        }
        if (precision > 100000) {
          alert('دقت بیش از ۱۰۰٬۰۰۰ نقطه ممکن است مرورگر را کند کند.');
          return null;
        }
        return precision;
      }

      function updateInputsFromBounds() {
        xMinInput.value = xMin;
        xMaxInput.value = xMax;
        yMinInput.value = yMin;
        yMaxInput.value = yMax;
      }

      function updatePrecisionDisplay() {
        precisionInput.value = currentPrecision;
        precisionIndicator.textContent = '🔬 دقت: ' + currentPrecision.toLocaleString('fa-IR');
      }

      // ---------- تبدیل مختصات ----------
      function toCanvasX(mathX) { return ((mathX - xMin) / (xMax - xMin)) * canvas.width; }
      function toCanvasY(mathY) { return canvas.height - ((mathY - yMin) / (yMax - yMin)) * canvas.height; }
      function toMathX(canvasX) { return xMin + (canvasX / canvas.width) * (xMax - xMin); }
      function toMathY(canvasY) { return yMin + ((canvas.height - canvasY) / canvas.height) * (yMax - yMin); }

      // ---------- گام مناسب برای شبکه ----------
      function niceStep(range) {
        const roughStep = range / 10;
        const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
        const residual = roughStep / magnitude;
        let niceResidual;
        if (residual <= 1.5) niceResidual = 1;
        else if (residual <= 3.5) niceResidual = 2;
        else if (residual <= 7.5) niceResidual = 5;
        else niceResidual = 10;
        return niceResidual * magnitude;
      }

      // ---------- رسم شبکه ----------
      function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const xRange = xMax - xMin;
        const yRange = yMax - yMin;
        const xStep = niceStep(xRange);
        const yStep = niceStep(yRange);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 1;
        let xStart = Math.ceil(xMin / xStep) * xStep;
        for (let x = xStart; x <= xMax; x += xStep) {
          const cx = toCanvasX(x);
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
        }
        let yStart = Math.ceil(yMin / yStep) * yStep;
        for (let y = yStart; y <= yMax; y += yStep) {
          const cy = toCanvasY(y);
          ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 1.5;
        if (yMin <= 0 && yMax >= 0) {
          const cy = toCanvasY(0);
          ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
        }
        if (xMin <= 0 && xMax >= 0) {
          const cx = toCanvasX(0);
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.font = '12px "Segoe UI", Tahoma, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let x = xStart; x <= xMax; x += xStep) {
          if (Math.abs(x) < xStep / 100) continue;
          const cx = toCanvasX(x);
          const cy = toCanvasY(0);
          ctx.fillText(parseFloat(x.toFixed(4)), cx, cy + 6);
        }
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let y = yStart; y <= yMax; y += yStep) {
          if (Math.abs(y) < yStep / 100) continue;
          const cx = toCanvasX(0);
          const cy = toCanvasY(y);
          ctx.fillText(parseFloat(y.toFixed(4)), cx - 8, cy);
        }
        if (xMin <= 0 && xMax >= 0 && yMin <= 0 && yMax >= 0) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          ctx.fillText('0', toCanvasX(0) - 6, toCanvasY(0) + 4);
        }
      }

      // ---------- ارزیابی تابع ----------
      function evaluateFunction(funcStr, x) {
        try {
          const f = new Function('x', `return ${funcStr};`);
          const result = f(x);
          if (typeof result !== 'number' || !isFinite(result)) return NaN;
          return result;
        } catch (e) { return NaN; }
      }

      // ---------- رسم تابع ----------
      function drawFunction() {
        const funcStr = functionInput.value.trim();
        if (!funcStr) return;

        const precision = currentPrecision;

        ctx.beginPath();
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(255, 107, 107, 0.6)';
        ctx.shadowBlur = 8;

        let firstPoint = true;
        let prevY = null;
        const step = (xMax - xMin) / precision;

        for (let i = 0; i <= precision; i++) {
          const x = xMin + i * step;
          const px = toCanvasX(x);
          const y = evaluateFunction(funcStr, x);

          if (isNaN(y)) { firstPoint = true; prevY = null; continue; }

          const cy = toCanvasY(y);
          if (prevY !== null && Math.abs(y - prevY) > (yMax - yMin) * 0.8) {
            firstPoint = true;
          }

          const clampedCy = Math.max(-1000, Math.min(2000, cy));
          if (firstPoint) { ctx.moveTo(px, clampedCy); firstPoint = false; }
          else { ctx.lineTo(px, clampedCy); }

          prevY = y;
        }

        ctx.stroke();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
      }

      // ---------- خطوط تقاطع ----------
      function drawCrosshair() {
        if (mouseX === null || mouseY === null) return;
        if (mouseX < 0 || mouseX > canvas.width || mouseY < 0 || mouseY > canvas.height) return;
        const mathX = toMathX(mouseX);
        const mathY = toMathY(mouseY);
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mouseX, 0); ctx.lineTo(mouseX, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, mouseY); ctx.lineTo(canvas.width, mouseY); ctx.stroke();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 107, 107, 0.7)';
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const funcStr = functionInput.value.trim();
        let funcValue = '—';
        if (funcStr) {
          const val = evaluateFunction(funcStr, mathX);
          if (!isNaN(val)) funcValue = val.toFixed(6);
        }
        valueDisplay.innerHTML = `📍 x = ${mathX.toFixed(4)} | y = ${mathY.toFixed(4)} | f(x) = ${funcValue}`;
      }

      // ---------- رندر ----------
      function render() {
        drawGrid();
        drawFunction();
        drawCrosshair();
        updatePrecisionDisplay();
      }

      // ---------- زوم ----------
      function zoomAt(zoomFactor, centerCanvasX, centerCanvasY) {
        const mathX = toMathX(centerCanvasX);
        const mathY = toMathY(centerCanvasY);
        const newXMin = mathX - (mathX - xMin) * zoomFactor;
        const newXMax = mathX + (xMax - mathX) * zoomFactor;
        const newYMin = mathY - (mathY - yMin) * zoomFactor;
        const newYMax = mathY + (yMax - mathY) * zoomFactor;
        const newXRange = newXMax - newXMin;
        const newYRange = newYMax - newYMin;
        if (newXRange < 0.001 || newXRange > 1000 || newYRange < 0.001 || newYRange > 1000) {
          return false;
        }
        xMin = newXMin; xMax = newXMax;
        yMin = newYMin; yMax = newYMax;

        // افزایش خودکار دقت هنگام زوم مثبت
        if (zoomFactor < 1) {
          // زوم مثبت
          currentPrecision = Math.min(100000, Math.floor(currentPrecision * 1.3));
        } else {
          // زوم منفی
          currentPrecision = Math.max(10, Math.floor(currentPrecision / 1.3));
        }
        precisionInput.value = currentPrecision;
        updateInputsFromBounds();
        render();
        return true;
      }

      // ---------- رویدادهای ماوس ----------
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.offsetX;
        dragStartY = e.offsetY;
        dragStartXMin = xMin; dragStartXMax = xMax;
        dragStartYMin = yMin; dragStartYMax = yMax;
        canvas.style.cursor = 'grabbing';
      });
      window.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
      window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const canvasX = e.clientX - rect.left;
        const canvasY = e.clientY - rect.top;
        if (isDragging) {
          const dx = canvasX - dragStartX;
          const dy = canvasY - dragStartY;
          const xRange = dragStartXMax - dragStartXMin;
          const yRange = dragStartYMax - dragStartYMin;
          const dxMath = -(dx / canvas.width) * xRange;
          const dyMath = (dy / canvas.height) * yRange;
          xMin = dragStartXMin + dxMath;
          xMax = dragStartXMax + dxMath;
          yMin = dragStartYMin + dyMath;
          yMax = dragStartYMax + dyMath;
          updateInputsFromBounds();
          render();
        } else {
          mouseX = canvasX; mouseY = canvasY;
          render();
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mouseCanvasX = e.clientX - rect.left;
        const mouseCanvasY = e.clientY - rect.top;
        const zoomFactor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
        zoomAt(zoomFactor, mouseCanvasX, mouseCanvasY);
      });

      // ---------- دکمه‌های زوم ----------
      zoomInBtn.addEventListener('click', () => {
        zoomAt(1 / 1.15, canvas.width / 2, canvas.height / 2);
      });
      zoomOutBtn.addEventListener('click', () => {
        zoomAt(1.15, canvas.width / 2, canvas.height / 2);
      });

      // ---------- دکمه‌های کنترل ----------
      drawButton.addEventListener('click', () => {
        const p = readPrecision();
        if (p !== null) {
          currentPrecision = p;
          if (readBoundsFromInputs()) render();
        }
      });
      resetButton.addEventListener('click', () => {
        xMin = -8; xMax = 8; yMin = -5; yMax = 5;
        currentPrecision = 1000;
        precisionInput.value = currentPrecision;
        updateInputsFromBounds();
        render();
      });
      functionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const p = readPrecision();
          if (p !== null) {
            currentPrecision = p;
            if (readBoundsFromInputs()) render();
          }
        }
      });

      // ---------- مثال‌ها ----------
      exampleChips.forEach(chip => {
        chip.addEventListener('click', () => {
          functionInput.value = chip.getAttribute('data-func');
          xMinInput.value = chip.getAttribute('data-xmin');
          xMaxInput.value = chip.getAttribute('data-xmax');
          yMinInput.value = chip.getAttribute('data-ymin');
          yMaxInput.value = chip.getAttribute('data-ymax');
          currentPrecision = 1000;
          precisionInput.value = currentPrecision;
          if (readBoundsFromInputs()) render();
        });
      });

      // ---------- راه‌اندازی ----------
      precisionInput.value = currentPrecision;
      render();
      console.log('✅ رسم‌کنندهٔ دوبعدی با زوم هوشمند آماده است.');
      console.log('🔬 هنگام زوم با اسکرول، دقت به طور خودکار تغییر می‌کند.');
      console.log('➕➖ دکمه‌های زوم در گوشهٔ بالا-راست فعال هستند.');
    })();
  </script>
</body>
</html>
