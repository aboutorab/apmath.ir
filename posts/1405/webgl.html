<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسم نمودار سه‌بعدی تعاملی با WebGL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
      direction: rtl;
    }

    #info {
      text-align: center;
      margin-bottom: 20px;
    }

    #info h2 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
    }

    #info p {
      margin: 4px 0;
      color: #aaa;
      font-size: 13px;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .controls-panel label {
      font-size: 16px;
      font-weight: bold;
      color: #e94560;
    }

    .controls-panel input[type="text"] {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(233, 69, 96, 0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 25px;
      width: 350px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      direction: ltr;
      text-align: left;
      transition: all 0.3s;
    }

    .controls-panel input[type="text"]:focus {
      outline: none;
      border-color: #e94560;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
    }

    .controls-panel button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }

    .controls-panel button:hover {
      background: #ff6b81;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5);
    }

    .controls-panel button:active {
      transform: translateY(0);
    }

    #container {
      width: 820px;
      height: 580px;
      border: 2px solid rgba(233, 69, 96, 0.5);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
      cursor: grab;
      background: #0a0a1a;
    }

    #container:active {
      cursor: grabbing;
    }

    .examples-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    .example-chip {
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Courier New', monospace;
      direction: ltr;
    }

    .example-chip:hover {
      background: rgba(233, 69, 96, 0.25);
      border-color: #e94560;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
    }

    .status-message {
      margin-top: 12px;
      font-size: 14px;
      color: #ffd93d;
      min-height: 20px;
      text-align: center;
    }

    .status-message.error {
      color: #ff4757;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>🌐 رسم‌کنندهٔ سه‌بعدی توابع ریاضی</h2>
    <p>🖱️ چرخش: کلیک چپ + کشیدن | 🔍 زوم: اسکرول | ✋ جابجایی: کلیک راست + کشیدن</p>
    <p>✏️ تابع f(x, y) را وارد کنید و کلید Enter یا دکمهٔ رسم را بزنید</p>
  </div>

  <div id="container"></div>

  <div class="status-message" id="statusMessage">✅ سطح فعلی: z = sin(x² + y²)</div>
  <br>
  
  <div class="controls-panel">
    <label>f(x, y) =</label>
    <input type="text" id="functionInput" value="Math.sin(x*x + y*y)" placeholder="مثلاً: Math.cos(x)*Math.sin(y)" dir="ltr">
    <button id="drawButton">✨ رسم کن</button>
  </div>

  <div class="examples-row">
    <span style="color:#888; font-size:12px; margin-left:5px;">📋 مثال‌های آماده:</span>
    <button class="example-chip" data-func="Math.sqrt(x*x + y*y)">sqrt(x² + y²)</button>
    <button class="example-chip" data-func="Math.sin(x*x + y*y)">sin(x² + y²)</button>
    <button class="example-chip" data-func="Math.cos(x)*Math.sin(y)">cos(x)·sin(y)</button>
    <button class="example-chip" data-func="(x*x - y*y)/4">(x² - y²)/4</button>
    <button class="example-chip" data-func="(x*x + y*y)/4">(x² + y²)/4</button>
    <button class="example-chip" data-func="Math.exp(-(x*x + y*y)/4)">exp(-(x²+y²)/4)</button>
    <button class="example-chip" data-func="Math.sin(x) + Math.cos(y)">sin(x)+cos(y)</button>
    <button class="example-chip" data-func="Math.sin(Math.sqrt(x*x + y*y))">sin(√(x²+y²))</button>
    <button class="example-chip" data-func="Math.cos(Math.abs(x) + Math.abs(y))">cos(|x|+|y|)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==========================================
    // ۱. المان‌های DOM
    // ==========================================
    const container = document.getElementById('container');
    const functionInput = document.getElementById('functionInput');
    const drawButton = document.getElementById('drawButton');
    const statusMessage = document.getElementById('statusMessage');
    const exampleChips = document.querySelectorAll('.example-chip');

    // ==========================================
    // ۲. صحنه، دوربین، رندرر
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.set(6, 5, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // ==========================================
    // ۳. کنترل‌های چرخش
    // ==========================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.target.set(0, 0, 0);
    controls.update();

    // ==========================================
    // ۴. نورپردازی
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight1.position.set(1, 1, 1);
    scene.add(directionalLight1);

    const directionalLight2 = new THREE.DirectionalLight(0x4488ff, 0.4);
    directionalLight2.position.set(-1, -0.5, -0.5);
    scene.add(directionalLight2);

    // ==========================================
    // ۵. اضافه کردن محورها و صفحهٔ کمکی
    // ==========================================
    function createAxes(size) {
      // حذف محورهای قبلی (اگر وجود دارند)
      const oldAxes = scene.getObjectByName('axesGroup');
      if (oldAxes) scene.remove(oldAxes);

      const axesGroup = new THREE.Group();
      axesGroup.name = 'axesGroup';
      const axisLength = size + 0.8;
      const axisThickness = 0.03;

      const xAxisGeo = new THREE.CylinderGeometry(axisThickness, axisThickness, axisLength * 2, 8);
      const xAxisMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
      const xAxis = new THREE.Mesh(xAxisGeo, xAxisMat);
      xAxis.rotation.z = -Math.PI / 2;
      axesGroup.add(xAxis);

      const yAxisGeo = new THREE.CylinderGeometry(axisThickness, axisThickness, axisLength * 2, 8);
      const yAxisMat = new THREE.MeshBasicMaterial({ color: 0x44ff44 });
      const yAxis = new THREE.Mesh(yAxisGeo, yAxisMat);
      axesGroup.add(yAxis);

      const zAxisGeo = new THREE.CylinderGeometry(axisThickness, axisThickness, axisLength * 2, 8);
      const zAxisMat = new THREE.MeshBasicMaterial({ color: 0x4444ff });
      const zAxis = new THREE.Mesh(zAxisGeo, zAxisMat);
      zAxis.rotation.x = Math.PI / 2;
      axesGroup.add(zAxis);

      scene.add(axesGroup);
    }

    function createGrid(size) {
      const oldGrid = scene.getObjectByName('gridHelper');
      if (oldGrid) scene.remove(oldGrid);

      const gridHelper = new THREE.GridHelper(size * 2, 20, 0x444466, 0x222244);
      gridHelper.name = 'gridHelper';
      gridHelper.position.y = -size - 0.3;
      scene.add(gridHelper);
    }

    // ==========================================
    // ۶. کامپایل تابع از رشتهٔ ورودی
    // ==========================================
    function compileFunction(funcStr) {
      try {
        // ساخت تابعی با دو آرگومان x و y
        const f = new Function('x', 'y', `return ${funcStr};`);
        // تست با یک مقدار ساده
        const testResult = f(0, 0);
        if (typeof testResult !== 'number' || !isFinite(testResult)) {
          return { error: 'تابع باید یک عدد برگرداند. خروجی تابع شما برای (0,0) معتبر نیست.' };
        }
        return { func: f, error: null };
      } catch (e) {
        return { error: `خطا در تجزیهٔ تابع: ${e.message}` };
      }
    }

    // ==========================================
    // ۷. ساخت هندسهٔ سطح از تابع
    // ==========================================
    function createSurfaceGeometry(func, size, segments) {
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const colors = [];
      const indices = [];

      // ابتدا یک بار همهٔ zها را محاسبه می‌کنیم تا min و max را پیدا کنیم
      const allZ = [];
      for (let i = 0; i <= segments; i++) {
        const x = -size + (i / segments) * 2 * size;
        for (let j = 0; j <= segments; j++) {
          const y = -size + (j / segments) * 2 * size;
          let z;
          try {
            z = func(x, y);
          } catch (e) {
            z = NaN;
          }
          if (typeof z !== 'number' || !isFinite(z)) {
            z = 0; // مقدار پیش‌فرض برای نقاط نامعتبر
          }
          allZ.push(z);
        }
      }

      const validZ = allZ.filter(v => isFinite(v));
      let zMin = Math.min(...validZ);
      let zMax = Math.max(...validZ);
      
      // اگر همهٔ مقادیر یکسان بودند، بازه را کمی باز می‌کنیم
      if (zMax - zMin < 0.001) {
        zMin -= 0.5;
        zMax += 0.5;
      }

      // تولید رئوس و رنگ‌ها
      let idx = 0;
      for (let i = 0; i <= segments; i++) {
        const x = -size + (i / segments) * 2 * size;
        for (let j = 0; j <= segments; j++) {
          const y = -size + (j / segments) * 2 * size;
          const z = allZ[idx];
          idx++;

          vertices.push(x, z, y); // توجه: محور Y در Three.js عمودی است

          // رنگ‌آمیزی بر اساس ارتفاع نرمال‌شده
          const normalizedZ = (z - zMin) / (zMax - zMin); // بین 0 و 1
          const clampedZ = Math.max(0, Math.min(1, normalizedZ));

          let r, g, b;
          if (clampedZ < 0.5) {
            const t = clampedZ * 2;
            r = 0.1;
            g = t;
            b = 1 - t;
          } else {
            const t = (clampedZ - 0.5) * 2;
            r = t;
            g = 1 - t;
            b = 0.1;
          }
          colors.push(r, g, b);
        }
      }

      // تولید اندیس‌های مثلث‌ها
      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < segments; j++) {
          const a = i * (segments + 1) + j;
          const b = a + 1;
          const c = a + (segments + 1);
          const d = c + 1;
          indices.push(a, b, d);
          indices.push(a, d, c);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    // ==========================================
    // ۸. به‌روزرسانی سطح (حذف قدیمی و ساخت جدید)
    // ==========================================
    const SIZE = 4;
    const SEGMENTS = 100;

    function updateSurface(funcStr) {
      // حذف سطح و وایرفریم قدیمی
      const oldSurface = scene.getObjectByName('surfaceMesh');
      if (oldSurface) scene.remove(oldSurface);
      const oldWireframe = scene.getObjectByName('surfaceWireframe');
      if (oldWireframe) scene.remove(oldWireframe);

      // کامپایل تابع
      const { func, error } = compileFunction(funcStr);
      if (error) {
        statusMessage.textContent = '❌ ' + error;
        statusMessage.className = 'status-message error';
        return false;
      }

      // ساخت هندسه
      let geometry;
      try {
        geometry = createSurfaceGeometry(func, SIZE, SEGMENTS);
      } catch (e) {
        statusMessage.textContent = '❌ خطا در ساخت سطح: ' + e.message;
        statusMessage.className = 'status-message error';
        return false;
      }

      // ساخت مش
      const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        roughness: 0.4,
        metalness: 0.1,
        flatShading: false,
      });

      const surface = new THREE.Mesh(geometry, material);
      surface.name = 'surfaceMesh';
      scene.add(surface);

      // ساخت وایرفریم
      const wireframeGeometry = new THREE.EdgesGeometry(geometry);
      const wireframeMaterial = new THREE.LineBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.12,
      });
      const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
      wireframe.name = 'surfaceWireframe';
      scene.add(wireframe);

      // به‌روزرسانی محورها و شبکه
      createAxes(SIZE);
      createGrid(SIZE);

      // پیام موفقیت
      statusMessage.textContent = '✅ سطح فعلی: z = ' + funcStr;
      statusMessage.className = 'status-message';
      return true;
    }

    // ==========================================
    // ۹. رویدادها
    // ==========================================
    function handleDraw() {
      const funcStr = functionInput.value.trim();
      if (!funcStr) {
        statusMessage.textContent = '⚠️ لطفاً یک تابع وارد کنید.';
        statusMessage.className = 'status-message error';
        return;
      }
      updateSurface(funcStr);
    }

    drawButton.addEventListener('click', handleDraw);

    functionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleDraw();
      }
    });

    // دکمه‌های مثال
    exampleChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const func = chip.getAttribute('data-func');
        functionInput.value = func;
        updateSurface(func);
      });
    });

    // ==========================================
    // ۱۰. مدیریت تغییر اندازهٔ پنجره
    // ==========================================
    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // ==========================================
    // ۱۱. حلقهٔ انیمیشن
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ==========================================
    // ۱۲. راه‌اندازی اولیه
    // ==========================================
    const initialFunc = functionInput.value.trim();
    updateSurface(initialFunc);
    animate();

    console.log('✅ رسم‌کنندهٔ سه‌بعدی تعاملی آماده است!');
    console.log('✏️  تابع f(x, y) را تغییر دهید و Enter بزنید.');
    console.log('🖱️  با ماوس بچرخانید و زوم کنید.');
  </script>
</body>
</html>
