<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسم نمودار سه‌بعدی با محورهای مدرج، دقت قابل تنظیم و دکمه‌های زوم</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
      direction: rtl;
    }
    #info { text-align: center; margin-bottom: 20px; }
    #info h2 { margin: 0 0 8px 0; font-size: 28px; color: #e94560; text-shadow: 0 0 20px rgba(233, 69, 96, 0.4); }
    #info p { margin: 4px 0; color: #aaa; font-size: 13px; }
    .controls-panel {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 20px; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px; border-radius: 40px;
      backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .field-group { display: flex; align-items: center; gap: 6px; }
    .field-group label { font-size: 12px; color: #ccc; }
    .field-group input[type="text"],
    .field-group input[type="number"] {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(233, 69, 96, 0.4);
      color: #fff; padding: 8px 12px; border-radius: 20px;
      font-size: 14px; font-family: 'Courier New', monospace;
      text-align: center; transition: all 0.3s;
    }
    .field-group input[type="text"] { width: 260px; direction: ltr; text-align: left; }
    .field-group input[type="number"] { width: 75px; direction: ltr; }
    .field-group input:focus { outline: none; border-color: #e94560; box-shadow: 0 0 15px rgba(233, 69, 96, 0.4); }
    .controls-panel button {
      background: #e94560; color: white; border: none;
      padding: 9px 22px; border-radius: 25px; font-size: 14px;
      cursor: pointer; font-weight: bold; transition: all 0.3s;
    }
    .controls-panel button:hover { background: #ff6b81; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5); }
    #container-wrapper {
      position: relative;
      width: 820px;
      height: 580px;
    }
    #container {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(233, 69, 96, 0.5);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
      cursor: grab; background: #0a0a1a;
    }
    #container:active { cursor: grabbing; }
    .zoom-buttons {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }
    .zoom-buttons button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(233, 69, 96, 0.7);
      background: rgba(0, 0, 0, 0.75);
      color: #e94560;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      backdrop-filter: blur(5px);
    }
    .zoom-buttons button:hover {
      background: rgba(233, 69, 96, 0.4);
      color: white;
      border-color: #e94560;
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    }
    .zoom-buttons button:active { transform: scale(0.95); }
    .precision-indicator {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffd93d;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 217, 61, 0.4);
      z-index: 20;
    }
    .examples-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; justify-content: center; }
    .example-chip {
      background: rgba(255, 255, 255, 0.08); color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 7px 16px;
      border-radius: 20px; font-size: 13px; cursor: pointer;
      transition: all 0.25s; font-family: 'Courier New', monospace; direction: ltr;
    }
    .example-chip:hover { background: rgba(233, 69, 96, 0.25); border-color: #e94560; color: #fff; transform: translateY(-2px); }
    .status-message {
      margin-top: 12px; font-size: 14px; color: #ffd93d;
      min-height: 20px; text-align: center;
    }
    .status-message.error { color: #ff4757; }
  </style>
</head>
<body>
  <div id="info">
    <h2>🌐 رسم‌کنندهٔ سه‌بعدی با محورهای مدرج و دکمه‌های زوم</h2>
    <p>🖱️ چرخش: کلیک چپ + کشیدن | 🔍 زوم: اسکرول | ✋ جابجایی: کلیک راست + کشیدن</p>
    <p>➕➖ از دکمه‌های گوشهٔ بالا-راست برای زوم استفاده کنید</p>
  </div>

  <div id="container-wrapper">
    <div id="container"></div>
    <div class="zoom-buttons">
      <button id="zoomInBtn" title="زوم مثبت">+</button>
      <button id="zoomOutBtn" title="زوم منفی">−</button>
    </div>
    <div class="precision-indicator" id="precisionIndicator">🔬 دقت: ۸۰×۸۰</div>
  </div>

  <div class="status-message" id="statusMessage">✅ سطح فعلی: z = sin(x² + y²)</div>
  <br>

  <div class="controls-panel">
    <div class="field-group">
      <label>f(x, y) =</label>
      <input type="text" id="functionInput" value="Math.sin(x*x + y*y)" dir="ltr">
    </div>
    <div class="field-group">
      <label>xMin</label>
      <input type="number" id="xMinInput" value="-4" step="any">
    </div>
    <div class="field-group">
      <label>xMax</label>
      <input type="number" id="xMaxInput" value="4" step="any">
    </div>
    <div class="field-group">
      <label>yMin</label>
      <input type="number" id="yMinInput" value="-4" step="any">
    </div>
    <div class="field-group">
      <label>yMax</label>
      <input type="number" id="yMaxInput" value="4" step="any">
    </div>
    <div class="field-group">
      <label>🔬 دقت (بخش‌ها):</label>
      <input type="number" id="segmentsInput" value="80" min="5" max="400" step="1">
    </div>
    <button id="drawButton">✨ رسم کن</button>
    <button id="resetButton" style="background:#475;">↺ پیش‌فرض</button>
  </div>

  <div class="examples-row">
    <span style="color:#888; font-size:12px;">📋 مثال‌ها:</span>
	<button class="example-chip" data-func="Math.sqrt(x*x + y*y)" data-xmin="-4" data-xmax="4" data-ymin="-4" data-ymax="4">sqrt(x² + y²)</button>
    <button class="example-chip" data-func="Math.sin(x*x + y*y)" data-xmin="-4" data-xmax="4" data-ymin="-4" data-ymax="4">sin(x² + y²)</button>
    <button class="example-chip" data-func="Math.cos(x)*Math.sin(y)" data-xmin="-5" data-xmax="5" data-ymin="-5" data-ymax="5">cos(x)·sin(y)</button>
	<button class="example-chip" data-func="Math.sin(x) + Math.cos(y)" data-xmin="-5" data-xmax="5" data-ymin="-5" data-ymax="5">sin(x)+cos(y)</button>
    <button class="example-chip" data-func="Math.sin(Math.sqrt(x*x + y*y))" data-xmin="-8" data-xmax="8" data-ymin="-8" data-ymax="8">sin(√(x²+y²))</button>
    <button class="example-chip" data-func="(x*x - y*y)/4" data-xmin="-6" data-xmax="6" data-ymin="-6" data-ymax="6">(x² - y²)/4</button>
    <button class="example-chip" data-func="Math.exp(-(x*x + y*y)/4)" data-xmin="-5" data-xmax="5" data-ymin="-5" data-ymax="5">exp(-(x²+y²)/4)</button>
    <button class="example-chip" data-func="Math.cos(Math.abs(x) + Math.abs(y))" data-xmin="-5" data-xmax="5" data-ymin="-5" data-ymax="5">cos(|x|+|y|)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== DOM Elements ==========
    const container = document.getElementById('container');
    const functionInput = document.getElementById('functionInput');
    const xMinInput = document.getElementById('xMinInput');
    const xMaxInput = document.getElementById('xMaxInput');
    const yMinInput = document.getElementById('yMinInput');
    const yMaxInput = document.getElementById('yMaxInput');
    const segmentsInput = document.getElementById('segmentsInput');
    const drawButton = document.getElementById('drawButton');
    const resetButton = document.getElementById('resetButton');
    const statusMessage = document.getElementById('statusMessage');
    const precisionIndicator = document.getElementById('precisionIndicator');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const exampleChips = document.querySelectorAll('.example-chip');

    // ========== Scene Setup ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
    camera.position.set(10, 7, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.target.set(0, 0, 0);
    controls.update();

    // ========== Lighting ==========
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(1, 1, 1);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x4488ff, 0.4);
    dirLight2.position.set(-1, -0.5, -0.5);
    scene.add(dirLight2);

    // ========== Helper: Nice Step ==========
    function niceStep(range, targetTicks) {
      const roughStep = range / targetTicks;
      const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
      const residual = roughStep / magnitude;
      let niceResidual;
      if (residual <= 1.5) niceResidual = 1;
      else if (residual <= 3.5) niceResidual = 2;
      else if (residual <= 7.5) niceResidual = 5;
      else niceResidual = 10;
      return niceResidual * magnitude;
    }

    // ========== Graduated Axes ==========
    function createGraduatedAxes(xMin, xMax, yMin, yMax, zMin, zMax) {
      const oldAxes = scene.getObjectByName('axesGroup');
      if (oldAxes) scene.remove(oldAxes);

      const axesGroup = new THREE.Group();
      axesGroup.name = 'axesGroup';

      const axisLength = Math.max(xMax - xMin, yMax - yMin, zMax - zMin) + 1.5;
      const axisThickness = 0.04;
      const tickLength = 0.15;
      const tickThickness = 0.02;
      const fontSize = 0.3;

      function createAxisLine(color, from, to) {
        const dir = new THREE.Vector3().subVectors(to, from);
        const length = dir.length();
        const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
        const geo = new THREE.CylinderGeometry(axisThickness, axisThickness, length, 8);
        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
        mesh.position.copy(mid);
        const axis = new THREE.Vector3(0, 1, 0);
        const quat = new THREE.Quaternion().setFromUnitVectors(axis, dir.normalize());
        mesh.setRotationFromQuaternion(quat);
        axesGroup.add(mesh);
      }

      function createTick(from, to, color) {
        const dir = new THREE.Vector3().subVectors(to, from);
        const length = dir.length();
        const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
        const geo = new THREE.CylinderGeometry(tickThickness, tickThickness, length, 6);
        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
        mesh.position.copy(mid);
        const axis = new THREE.Vector3(0, 1, 0);
        const quat = new THREE.Quaternion().setFromUnitVectors(axis, dir.normalize());
        mesh.setRotationFromQuaternion(quat);
        axesGroup.add(mesh);
      }

      function createLabel(text, position, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'transparent';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 38px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 64, 32);
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.copy(position);
        sprite.scale.set(fontSize * 2, fontSize, 1);
        axesGroup.add(sprite);
      }

      // محور X (قرمز)
      const xFrom = new THREE.Vector3(xMin - 0.3, 0, 0);
      const xTo = new THREE.Vector3(xMax + 0.3, 0, 0);
      createAxisLine(0xff4444, xFrom, xTo);

      // محور Y (سبز) - عمودی
      const yFrom = new THREE.Vector3(0, -Math.max(Math.abs(zMin), Math.abs(zMax)) - 0.3, 0);
      const yTo = new THREE.Vector3(0, Math.max(Math.abs(zMin), Math.abs(zMax)) + 0.3, 0);
      createAxisLine(0x44ff44, yFrom, yTo);

      // محور Z (آبی) - عمق
      const zFrom = new THREE.Vector3(0, 0, yMin - 0.3);
      const zTo = new THREE.Vector3(0, 0, yMax + 0.3);
      createAxisLine(0x4444ff, zFrom, zTo);

      // تیک‌های محور X
      const xStep = niceStep(xMax - xMin, 8);
      let xTickStart = Math.ceil(xMin / xStep) * xStep;
      for (let x = xTickStart; x <= xMax; x += xStep) {
        createTick(
          new THREE.Vector3(x, -tickLength / 2, 0),
          new THREE.Vector3(x, tickLength / 2, 0),
          0xff4444
        );
        createLabel(x.toFixed(2), new THREE.Vector3(x, -0.4, 0), '#ff8888');
      }

      // تیک‌های محور Z (عمق)
      const zStep = niceStep(yMax - yMin, 8);
      let zTickStart = Math.ceil(yMin / zStep) * zStep;
      for (let z = zTickStart; z <= yMax; z += zStep) {
        createTick(
          new THREE.Vector3(0, -tickLength / 2, z),
          new THREE.Vector3(0, tickLength / 2, z),
          0x4444ff
        );
        createLabel(z.toFixed(2), new THREE.Vector3(0, -0.4, z), '#8888ff');
      }

      // تیک‌های محور Y (عمودی)
      const yStepVal = niceStep(zMax - zMin, 8);
      let yTickStart = Math.ceil(zMin / yStepVal) * yStepVal;
      for (let val = yTickStart; val <= zMax; val += yStepVal) {
        createTick(
          new THREE.Vector3(-tickLength / 2, val, 0),
          new THREE.Vector3(tickLength / 2, val, 0),
          0x44ff44
        );
        createLabel(val.toFixed(2), new THREE.Vector3(-0.4, val, 0), '#88ff88');
      }

      // برچسب‌های انتهای محورها
      createLabel('X', new THREE.Vector3(xMax + 0.8, 0, 0), '#ff6666');
      createLabel('Z', new THREE.Vector3(0, 0, yMax + 0.8), '#6666ff');
      createLabel('Y', new THREE.Vector3(0, Math.max(Math.abs(zMin), Math.abs(zMax)) + 0.8, 0), '#66ff66');

      scene.add(axesGroup);
    }

    // ========== Grid Helper ==========
    function createGrid(size) {
      const old = scene.getObjectByName('gridHelper');
      if (old) scene.remove(old);
      const gridHelper = new THREE.GridHelper(size * 2, 20, 0x444466, 0x222244);
      gridHelper.name = 'gridHelper';
      gridHelper.position.y = -size - 0.5;
      scene.add(gridHelper);
    }

    // ========== Function Compiler ==========
    function compileFunction(funcStr) {
      try {
        const f = new Function('x', 'y', `return ${funcStr};`);
        const test = f(0, 0);
        if (typeof test !== 'number' || !isFinite(test)) {
          return { error: 'تابع باید یک عدد برگرداند.' };
        }
        return { func: f, error: null };
      } catch (e) {
        return { error: `خطا در تجزیه: ${e.message}` };
      }
    }

    // ========== Surface Geometry ==========
    function createSurfaceGeometry(func, xMin, xMax, yMin, yMax, segments) {
      const xRange = xMax - xMin;
      const yRange = yMax - yMin;
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const colors = [];
      const indices = [];

      const allZ = [];
      for (let i = 0; i <= segments; i++) {
        const x = xMin + (i / segments) * xRange;
        for (let j = 0; j <= segments; j++) {
          const y = yMin + (j / segments) * yRange;
          let z;
          try { z = func(x, y); } catch (e) { z = NaN; }
          if (typeof z !== 'number' || !isFinite(z)) z = 0;
          allZ.push(z);
        }
      }

      const validZ = allZ.filter(v => isFinite(v));
      let zMin = Math.min(...validZ);
      let zMax = Math.max(...validZ);
      if (zMax - zMin < 0.001) { zMin -= 0.5; zMax += 0.5; }

      let idx = 0;
      for (let i = 0; i <= segments; i++) {
        const x = xMin + (i / segments) * xRange;
        for (let j = 0; j <= segments; j++) {
          const y = yMin + (j / segments) * yRange;
          const z = allZ[idx++];
          vertices.push(x, z, y);
          const normZ = (z - zMin) / (zMax - zMin);
          const c = Math.max(0, Math.min(1, normZ));
          let r, g, b;
          if (c < 0.5) {
            const t = c * 2;
            r = 0.1; g = t; b = 1 - t;
          } else {
            const t = (c - 0.5) * 2;
            r = t; g = 1 - t; b = 0.1;
          }
          colors.push(r, g, b);
        }
      }

      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < segments; j++) {
          const a = i * (segments + 1) + j;
          const b = a + 1;
          const c = a + (segments + 1);
          const d = c + 1;
          indices.push(a, b, d);
          indices.push(a, d, c);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return { geometry, zMin, zMax };
    }

    // ========== Update Surface ==========
    function updateSurface(funcStr) {
      const xMin = parseFloat(xMinInput.value);
      const xMax = parseFloat(xMaxInput.value);
      const yMin = parseFloat(yMinInput.value);
      const yMax = parseFloat(yMaxInput.value);
      const segments = parseInt(segmentsInput.value);

      if (isNaN(xMin) || isNaN(xMax) || isNaN(yMin) || isNaN(yMax)) {
        statusMessage.textContent = '❌ بازه‌ها باید عدد باشند.';
        statusMessage.className = 'status-message error';
        return false;
      }
      if (xMin >= xMax || yMin >= yMax) {
        statusMessage.textContent = '❌ بازه نامعتبر: xMin < xMax و yMin < yMax الزامی است.';
        statusMessage.className = 'status-message error';
        return false;
      }
      if (isNaN(segments) || segments < 3) {
        statusMessage.textContent = '❌ دقت باید حداقل ۳ باشد.';
        statusMessage.className = 'status-message error';
        return false;
      }
      if (segments > 500) {
        statusMessage.textContent = '⚠️ دقت بیش از ۵۰۰ ممکن است مرورگر را کند کند.';
        statusMessage.className = 'status-message error';
        return false;
      }

      const oldSurface = scene.getObjectByName('surfaceMesh');
      if (oldSurface) scene.remove(oldSurface);
      const oldWire = scene.getObjectByName('surfaceWireframe');
      if (oldWire) scene.remove(oldWire);

      const { func, error } = compileFunction(funcStr);
      if (error) {
        statusMessage.textContent = '❌ ' + error;
        statusMessage.className = 'status-message error';
        return false;
      }

      let result;
      try {
        result = createSurfaceGeometry(func, xMin, xMax, yMin, yMax, segments);
      } catch (e) {
        statusMessage.textContent = '❌ خطا در ساخت سطح: ' + e.message;
        statusMessage.className = 'status-message error';
        return false;
      }

      const { geometry, zMin, zMax } = result;

      const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        roughness: 0.4,
        metalness: 0.1,
      });
      const surface = new THREE.Mesh(geometry, material);
      surface.name = 'surfaceMesh';
      scene.add(surface);

      const wireGeo = new THREE.EdgesGeometry(geometry);
      const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12 });
      const wire = new THREE.LineSegments(wireGeo, wireMat);
      wire.name = 'surfaceWireframe';
      scene.add(wire);

      const maxSize = Math.max(xMax - xMin, yMax - yMin, Math.abs(zMin), Math.abs(zMax));
      createGraduatedAxes(xMin, xMax, yMin, yMax, zMin, zMax);
      createGrid(maxSize);

      precisionIndicator.textContent = `🔬 دقت: ${segments}×${segments}`;

      statusMessage.textContent = `✅ سطح: z = ${funcStr} | بازه: [${xMin}, ${xMax}] × [${yMin}, ${yMax}] | دقت: ${segments}×${segments}`;
      statusMessage.className = 'status-message';
      return true;
    }

    // ========== Zoom Functions ==========
    function zoomCamera(factor) {
      // تغییر فاصلهٔ دوربین از مرکز صحنه
      const direction = new THREE.Vector3().subVectors(camera.position, controls.target);
      const distance = direction.length();
      const newDistance = distance * factor;

      // محدودیت فاصله
      if (newDistance < 1 || newDistance > 100) return;

      direction.normalize();
      camera.position.copy(controls.target.clone().add(direction.multiplyScalar(newDistance)));
      controls.update();
    }

    function zoomIn() {
      zoomCamera(1 / 1.25);
    }

    function zoomOut() {
      zoomCamera(1.25);
    }

    // ========== Event Handlers ==========
    function handleDraw() {
      const funcStr = functionInput.value.trim();
      if (!funcStr) {
        statusMessage.textContent = '⚠️ لطفاً یک تابع وارد کنید.';
        statusMessage.className = 'status-message error';
        return;
      }
      updateSurface(funcStr);
    }

    drawButton.addEventListener('click', handleDraw);
    functionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleDraw(); });

    // دکمه‌های زوم
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);

    resetButton.addEventListener('click', () => {
      functionInput.value = 'Math.sin(x*x + y*y)';
      xMinInput.value = -4;
      xMaxInput.value = 4;
      yMinInput.value = -4;
      yMaxInput.value = 4;
      segmentsInput.value = 80;
      // بازنشانی دوربین
      camera.position.set(10, 7, 10);
      controls.target.set(0, 0, 0);
      controls.update();
      updateSurface(functionInput.value);
    });

    exampleChips.forEach(chip => {
      chip.addEventListener('click', () => {
        functionInput.value = chip.getAttribute('data-func');
        xMinInput.value = chip.getAttribute('data-xmin');
        xMaxInput.value = chip.getAttribute('data-xmax');
        yMinInput.value = chip.getAttribute('data-ymin');
        yMaxInput.value = chip.getAttribute('data-ymax');
        updateSurface(functionInput.value);
      });
    });

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // ========== Animation Loop ==========
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ========== Initial Render ==========
    updateSurface(functionInput.value);
    animate();

    console.log('✅ رسم‌کنندهٔ سه‌بعدی با محورهای مدرج و دکمه‌های زوم آماده است.');
    console.log('➕➖ از دکمه‌های گوشهٔ بالا-راست برای زوم استفاده کنید.');
  </script>
</body>
</html>
